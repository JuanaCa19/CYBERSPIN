document.addEventListener('click',e=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.resume)AC.resume()}catch(_){}
 const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const a=el.dataset.a,v=el.dataset.v,i=+el.dataset.i;
 if(a.startsWith('s:')){S.note='';S.ed=-1;S.qe=-1;go(a.slice(2));return}
 switch(a){
  case'new':sortear();break;
  case'start':if(pick.length===3)startGame(pick.slice());break;
  case'close':if(G&&!G.over){S.scr='';R()}else{G=null;S.note='';go('menu')}break;
  case'rules':if(G&&!G.over)G.paused=true;go('rules');break;
  case'padd':{const n=$('#pn').value.trim();if(!n){S.note='The name cannot be empty.';R();break}
   if(S.ed>=0){if(S.p.some((x,k)=>k!==S.ed&&x.toLowerCase()===n.toLowerCase())){S.note='Duplicate name.';R();break}S.p[S.ed]=n.slice(0,30);S.ed=-1;S.note='Saved.';save();R()}else addNames([n]);break}
  case'pcopy':{const t=S.p.join('\n');const ta=$('#pl');if(ta){ta.value=t;ta.select()}try{navigator.clipboard.writeText(t)}catch(e){}S.note='';break}
  case'plist':addNames($('#pl').value.split(/\r?\n/));break;
  case'pe':S.ed=i;S.note='';R();break;
  case'pd':S.p.splice(i,1);S.ed=-1;save();R();break;
  case'mode':S.cfg.mode=v;save();R();break;
  case'lvl':S.cfg.level=v;save();R();break;
  case'tp':{const t=T[+v];S.cfg.topics=S.cfg.topics.includes(t)?S.cfg.topics.filter(x=>x!==t):S.cfg.topics.concat(t);save();R();break}
  case'qsave':qsave();break;
  case'qe':S.qe=i;S.note='';R();break;
  case'qd':S.q.splice(i,1);S.qe=-1;save();R();break;
  case'rep2':S.cfg.rep=v;save();R();break;
  case'snd':S.cfg.snd=!S.cfg.snd;save();if(S.scr)R();break;
  case'go':startTurn();break;
  case'ok':verdict(true);break;
  case'no':if(G&&G.phase==='question'&&!hold())openDlg('Mark as INCORRECT? The player will lose a limb.',()=>verdict(false));break;
  case'rep':repeatQ();break;
  case'rev':if(G){if(G.phase==='tie')G.tb.reveal=!G.tb.reveal;else G.reveal=!G.reveal}break;
  case'tbw':tieWin(i);break;
  case'tbn':if(G&&G.phase==='tie'&&!hold()){const t=G.tb;t.idx=(t.idx+1)%t.c.length;t.t=TIME;t.run=true;tieFocus();SFX.start()}break;
  case'tbq':if(G&&G.phase==='tie'&&!hold()){const t=G.tb;t.q=pickQ();t.reveal=false;t.t=TIME;t.run=true;SFX.start()}break;
  case'tbd':if(G&&G.phase==='tie'&&!hold()){G.tbDone=true;conclude()}break;
  case'pz':if(G&&!G.over&&!S.scr)G.paused=!G.paused;break;
  case'rst':if(G&&!G.over)openDlg('Restart the game with the same players?',()=>startGame(G.players.map(p=>p.name)));break;
  case'fin':if(G&&!G.over)openDlg('End the game now?',()=>finish());break;
  case'dok':{const d=DLG;closeDlg();if(d)d.f();break}
  case'dno':closeDlg();break}});
document.addEventListener('input',e=>{if(e.target.id==='vol'){S.cfg.vol=+e.target.value;save()}});
document.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f||!/^(pcsv|qcsv)$/.test(e.target.id))return;const id=e.target.id,r=new FileReader();r.onload=()=>id==='pcsv'?addNames(String(r.result).split(/\r?\n/).map(l=>l.split(/[,;]/)[0])):qcsv(String(r.result));r.readAsText(f)});
buildWorld(['Team 1','Team 2','Team 3']);R();requestAnimationFrame(loop);
